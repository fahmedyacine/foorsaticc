<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Chatbot - RAG System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Document Chatbot</h1>
            <div class="status" id="status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Checking status...</span>
            </div>
        </header>
        
        <!-- NEW: Folder Selection Section -->
        <div class="folder-selection">
            <h3>📁 Select Document Sources:</h3>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" name="folder" value="folder1" checked>
                    <span>Guide NGBSS</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="folder" value="folder2" checked>
                    <span>Offres</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="folder" value="folder3" checked>
                    <span>Convention</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="folder" value="folder4" checked>
                    <span>Offres en arabe</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="folder" value="folder5" checked>
                    <span>Depot Vente</span>
                </label>
            </div>
            <button id="reloadButton" onclick="reloadDocuments()">🔄 Reload Documents</button>
        </div>
        
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message system">
                    <div class="message-content">
                        <strong>System:</strong> Welcome! I can answer questions about the processed documents. 
                        Ask me anything in French or Arabic.
                    </div>
                </div>
            </div>
            <div class="input-container">
                <textarea 
                    id="questionInput" 
                    placeholder="Type your question here (French or Arabic)..."
                    rows="2"
                ></textarea>
                <button id="sendButton" onclick="sendQuestion()">
                    <span>Send</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
        <div class="info-panel">
            <div class="info-item">
                <strong>Documents Loaded:</strong>
                <span id="docCount">-</span>
            </div>
            <div class="info-item">
                <strong>Language Detection:</strong>
                <span>Automatic (French/Arabic)</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
